name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App · lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  generator:
    name: Generator · tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: generator/requirements-dev.txt
      - run: pip install -r requirements-dev.txt -e .
      - run: pytest -q

  pipeline:
    name: Pipeline · generate → load → dbt build (DuckDB)
    runs-on: ubuntu-latest
    needs: generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Same layout as local development: one virtual environment per part.
      - name: Set up environments
        run: |
          python -m venv generator/.venv
          generator/.venv/bin/pip install -q -e generator
          python -m venv warehouse/.venv
          warehouse/.venv/bin/pip install -q -r warehouse/requirements.txt
      - name: Run the pipeline (models, tests, reconciliation with the answer key)
        run: ./warehouse/run_pipeline.sh
      - name: Incremental day (same as an Airflow run)
        run: ./warehouse/run_pipeline.sh 2026-09-15
      - name: Export dashboard CSVs + HTML preview
        run: |
          warehouse/.venv/bin/python warehouse/export.py
          warehouse/.venv/bin/python warehouse/build_dashboard.py
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-csvs
          path: exports/
