<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Direction 1 — Sheet (phone)</title>
<link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f2ee;
    --sheet: #fcfbf8;
    --ink: #1c1b19;
    --muted: #6e6b65;
    --faint: #a6a39c;
    --rule: #e4e1da;
    --fill: #ebe9e3;
    --do: #d4512f;
    --schedule: #3d68c2;
    --delegate: #9165a8;
    --eliminate: #9b988f;
    --warn: #b0652d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #dcdad3; color: var(--ink); font: 400 15px/1.45 "Switzer", system-ui, sans-serif; -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 1; padding: 40px 24px 60px; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { display: block; flex-shrink: 0; }
  .ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .fill { fill: currentColor; stroke: none; }

  .row-of-phones { display: flex; gap: 40px; justify-content: center; flex-wrap: wrap; }
  figure { display: flex; flex-direction: column; gap: 14px; align-items: center; }
  figcaption { font-size: 13px; color: #55524c; }
  .phone { width: 375px; height: 812px; border-radius: 46px; background: var(--bg); position: relative; overflow: hidden; box-shadow: 0 0 0 10px #1c1b19, 0 30px 60px -20px rgba(0,0,0,.45); }
  .status { height: 50px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 30px 6px 34px; font-size: 15px; font-weight: 600; }
  .status .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; border-radius: 20px; background: #000; }
  .scroll { height: calc(100% - 50px); overflow: hidden; padding: 0 16px; }

  /* top bar */
  .top { display: flex; align-items: center; justify-content: space-between; height: 52px; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 16px; letter-spacing: -0.01em; }
  .seg { display: flex; padding: 2px; background: var(--fill); border-radius: 8px; }
  .seg button { padding: 5px 11px; border-radius: 6px; font-size: 13.5px; font-weight: 500; color: var(--muted); }
  .seg button.on { background: var(--sheet); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  .date { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 4px; }
  .date .d { font-size: 15px; } .date .d b { font-weight: 600; } .date .d span { color: var(--muted); }
  .icon-btn { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; color: var(--muted); }

  .summary { font-size: 22px; font-weight: 500; letter-spacing: -0.025em; line-height: 1.25; margin: 10px 0 14px; }
  .summary .soft { color: var(--faint); }

  /* mini map */
  .map { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
  .map a { background: var(--sheet); padding: 9px 11px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; }
  .map a .n { margin-left: auto; color: var(--faint); font-weight: 400; }
  .map a.warn .n { color: var(--warn); }
  .sq { width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex-shrink: 0; }

  /* list sheet */
  .sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; box-shadow: 0 1px 2px rgba(28,27,25,.04); }
  .q + .q { border-top: 1px solid var(--rule); }
  .q-head { display: flex; align-items: center; gap: 9px; padding: 13px 14px 6px; }
  .q-head h3 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .q-head .sub { color: var(--faint); font-size: 12.5px; }
  .q-head .count { margin-left: auto; color: var(--faint); font-size: 13px; }
  .task { display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 6px 0 14px; }
  .chk { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid #c9c6bf; display: grid; place-items: center; flex-shrink: 0; }
  .done .chk { background: var(--ink); border-color: var(--ink); color: #fff; }
  .done .chk .ico { width: 12px; height: 12px; stroke-width: 2.6; }
  .t { flex: 1; min-width: 0; }
  .t .text { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .done .t .text { color: var(--faint); text-decoration: line-through; text-decoration-color: #cfccc5; }
  .t .meta { display: flex; gap: 10px; color: var(--faint); font-size: 12.5px; margin-top: 1px; }
  .t .meta span { display: flex; align-items: center; gap: 3px; }
  .t .meta .ico { width: 12px; height: 12px; }
  .t .meta .warn { color: var(--warn); }
  .task .icon-btn { width: 38px; height: 38px; color: var(--faint); }
  .task.selected { background: var(--fill); }

  /* bottom: add bar + focus */
  .dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 30px; background: linear-gradient(transparent, var(--bg) 26%); display: flex; gap: 10px; }
  .add { flex: 1; display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 16px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; color: var(--faint); box-shadow: 0 6px 20px -8px rgba(28,27,25,.18); }
  .focus-fab { width: 50px; height: 50px; border-radius: 14px; background: var(--ink); color: #fff; display: grid; place-items: center; box-shadow: 0 6px 20px -6px rgba(28,27,25,.45); }
  .focus-fab .ico { width: 16px; height: 16px; }

  /* bottom sheet */
  .scrim { position: absolute; inset: 0; background: rgba(28,27,25,.32); }
  .bsheet { position: absolute; left: 8px; right: 8px; bottom: 8px; background: var(--sheet); border-radius: 22px 22px 34px 34px; padding: 8px 8px 22px; box-shadow: 0 -10px 40px rgba(0,0,0,.18); }
  .grab { width: 36px; height: 5px; border-radius: 3px; background: #d9d6cf; margin: 2px auto 10px; }
  .bs-title { padding: 2px 12px 12px; }
  .bs-title b { display: block; font-weight: 600; font-size: 16px; letter-spacing: -0.01em; }
  .bs-title span { color: var(--faint); font-size: 13px; }
  .bs-label { font-size: 12.5px; color: var(--muted); padding: 6px 12px 8px; }
  .moves { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 4px 12px; }
  .moves button { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px; border-radius: 12px; background: var(--bg); text-align: left; font-weight: 500; font-size: 14.5px; }
  .moves button small { color: var(--faint); font-weight: 400; font-size: 12px; }
  .moves button.current { outline: 1.5px solid var(--ink); background: var(--sheet); }
  .bs-list { border-top: 1px solid var(--rule); margin: 0 4px; }
  .bs-list button { display: flex; align-items: center; gap: 14px; width: 100%; padding: 13px 8px; font-size: 15px; border-bottom: 1px solid var(--rule); }
  .bs-list button:last-child { border-bottom: 0; }
  .bs-list .ico { color: var(--muted); }
  .bs-list .danger, .bs-list .danger .ico { color: #b4432a; }

  /* focus */
  .focus { height: calc(100% - 50px); display: flex; flex-direction: column; padding: 0 20px 34px; }
  .focus .top { justify-content: space-between; }
  .focus .chip { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); padding: 6px 10px; background: var(--fill); border-radius: 8px; }
  .focus .mid { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .focus .label { color: var(--muted); font-size: 14px; }
  .focus .task-name { font-size: 24px; font-weight: 500; letter-spacing: -0.025em; line-height: 1.2; margin: 6px 0 34px; }
  .timer { font-size: 104px; font-weight: 500; letter-spacing: -0.055em; line-height: .9; }
  .timer .s { opacity: .3; margin: 0 -0.02em; }
  .bar { height: 3px; background: var(--rule); border-radius: 2px; margin: 26px 0 12px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 34%; background: var(--ink); }
  .ticks { display: flex; justify-content: space-between; color: var(--faint); font-size: 12.5px; }
  .focus .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { height: 52px; border-radius: 14px; font-weight: 500; font-size: 15.5px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn.primary { grid-column: 1 / -1; background: var(--ink); color: #fff; }
  .btn.secondary { background: var(--sheet); border: 1px solid var(--rule); }
  .btn.quiet { color: var(--muted); }
  .note { max-width: 860px; margin: 40px auto 0; font-size: 13.5px; line-height: 1.6; color: #55524c; text-align: center; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="play" viewBox="0 0 24 24"><path d="M7 4.8v14.4a.8.8 0 0 0 1.2.7l11.4-7.2a.8.8 0 0 0 0-1.4L8.2 4.1A.8.8 0 0 0 7 4.8z"/></symbol>
  <symbol id="pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></symbol>
  <symbol id="left" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="right" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></symbol>
  <symbol id="timer" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5"/></symbol>
  <symbol id="carry" viewBox="0 0 24 24"><path d="M4 7h11a5 5 0 0 1 0 10H8"/><path d="M11 13l-4 4 4 4"/></symbol>
  <symbol id="down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
  <symbol id="cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
  <symbol id="edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
  <symbol id="list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol>
  <symbol id="trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></symbol>
  <symbol id="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="logo" viewBox="0 0 20 20"><rect x="1" y="1" width="8.2" height="8.2" rx="2" fill="#d4512f"/><rect x="10.8" y="1" width="8.2" height="8.2" rx="2" fill="#1c1b19"/><rect x="1" y="10.8" width="8.2" height="8.2" rx="2" fill="#1c1b19"/><rect x="10.8" y="10.8" width="8.2" height="8.2" rx="2" fill="#1c1b19" opacity=".25"/></symbol>
</svg>

<div class="row-of-phones">

  <!-- 1. MATRIX -->
  <figure>
    <div class="phone">
      <div class="status"><span>9:41</span><span class="island"></span><span>●●●</span></div>
      <div class="scroll">
        <div class="top">
          <div class="brand"><svg width="20" height="20"><use href="#logo"/></svg>Priority</div>
          <div class="seg"><button class="on">Matrix</button><button>Patterns</button></div>
        </div>
        <div class="date">
          <button class="icon-btn"><svg class="ico"><use href="#left"/></svg></button>
          <span class="d"><b>Thursday</b> <span>8 Oct</span></span>
          <button class="icon-btn"><svg class="ico"><use href="#right"/></svg></button>
        </div>
        <p class="summary">3 of 9 done. 1h 15m focused, <span class="soft">83% on Do first.</span></p>

        <div class="map">
          <a><span class="sq" style="background:var(--do)"></span>Do first<span class="n">1/3</span></a>
          <a class="warn"><span class="sq" style="background:var(--schedule)"></span>Schedule<span class="n">0/3</span></a>
          <a><span class="sq" style="background:var(--delegate)"></span>Delegate<span class="n">1/2</span></a>
          <a><span class="sq" style="background:var(--eliminate)"></span>Eliminate<span class="n">1/1</span></a>
        </div>

        <div class="sheet">
          <section class="q">
            <div class="q-head"><span class="sq" style="background:var(--do)"></span><h3>Do first</h3><span class="sub">Urgent · Important</span></div>
            <div class="task"><span class="chk"></span><span class="t"><span class="text">Fix broken survey export</span><span class="meta"><span><svg class="ico"><use href="#timer"/></svg>50m</span></span></span><button class="icon-btn"><svg class="ico"><use href="#more"/></svg></button></div>
            <div class="task"><span class="chk"></span><span class="t"><span class="text">Prep slides for 2pm review</span><span class="meta"><span class="warn"><svg class="ico"><use href="#carry"/></svg>2 days</span></span></span><button class="icon-btn"><svg class="ico"><use href="#more"/></svg></button></div>
            <div class="task done"><span class="chk"><svg class="ico"><use href="#check"/></svg></span><span class="t"><span class="text">Send numbers to finance</span></span><button class="icon-btn"><svg class="ico"><use href="#more"/></svg></button></div>
          </section>
          <section class="q">
            <div class="q-head"><span class="sq" style="background:var(--schedule)"></span><h3>Schedule</h3><span class="sub">Important</span></div>
            <div class="task"><span class="chk"></span><span class="t"><span class="text">Read dbt docs: incremental models</span><span class="meta"><span><svg class="ico"><use href="#timer"/></svg>25m</span><span class="warn"><svg class="ico"><use href="#carry"/></svg>4 days</span></span></span><button class="icon-btn"><svg class="ico"><use href="#more"/></svg></button></div>
            <div class="task"><span class="chk"></span><span class="t"><span class="text">Draft portfolio case study</span></span><button class="icon-btn"><svg class="ico"><use href="#more"/></svg></button></div>
          </section>
        </div>
      </div>
      <div class="dock">
        <div class="add"><svg class="ico"><use href="#plus"/></svg>Add a task</div>
        <button class="focus-fab" aria-label="Start focus"><svg class="ico fill"><use href="#play"/></svg></button>
      </div>
    </div>
    <figcaption>Matrix: the 2×2 map jumps to a quadrant</figcaption>
  </figure>

  <!-- 2. TASK SHEET -->
  <figure>
    <div class="phone">
      <div class="status"><span>9:41</span><span class="island"></span><span>●●●</span></div>
      <div class="scroll">
        <div class="top">
          <div class="brand"><svg width="20" height="20"><use href="#logo"/></svg>Priority</div>
          <div class="seg"><button class="on">Matrix</button><button>Patterns</button></div>
        </div>
        <div class="date">
          <button class="icon-btn"><svg class="ico"><use href="#left"/></svg></button>
          <span class="d"><b>Thursday</b> <span>8 Oct</span></span>
          <button class="icon-btn"><svg class="ico"><use href="#right"/></svg></button>
        </div>
        <p class="summary">3 of 9 done. 1h 15m focused, <span class="soft">83% on Do first.</span></p>
        <div class="sheet">
          <section class="q">
            <div class="q-head"><span class="sq" style="background:var(--do)"></span><h3>Do first</h3><span class="sub">Urgent · Important</span></div>
            <div class="task"><span class="chk"></span><span class="t"><span class="text">Fix broken survey export</span></span><button class="icon-btn"><svg class="ico"><use href="#more"/></svg></button></div>
            <div class="task selected"><span class="chk"></span><span class="t"><span class="text">Prep slides for 2pm review</span></span><button class="icon-btn"><svg class="ico"><use href="#more"/></svg></button></div>
          </section>
        </div>
      </div>
      <div class="scrim"></div>
      <div class="bsheet">
        <div class="grab"></div>
        <div class="bs-title"><b>Prep slides for 2pm review</b><span>Added Tuesday · carried 2 days</span></div>
        <div class="bs-label">Move to</div>
        <div class="moves">
          <button class="current"><span class="sq" style="background:var(--do)"></span>Do first<small>Current</small></button>
          <button><span class="sq" style="background:var(--schedule)"></span>Schedule<small>Important</small></button>
          <button><span class="sq" style="background:var(--delegate)"></span>Delegate<small>Urgent</small></button>
          <button><span class="sq" style="background:var(--eliminate)"></span>Eliminate<small>Neither</small></button>
        </div>
        <div class="bs-list">
          <button><svg class="ico"><use href="#play"/></svg>Start focus</button>
          <button><svg class="ico"><use href="#cal"/></svg>Move to tomorrow</button>
          <button><svg class="ico"><use href="#list"/></svg>Subtasks</button>
          <button><svg class="ico"><use href="#edit"/></svg>Rename</button>
          <button class="danger"><svg class="ico"><use href="#trash"/></svg>Delete</button>
        </div>
      </div>
    </div>
    <figcaption>Tap ⋯ on a task: move it, focus on it, or edit it</figcaption>
  </figure>

  <!-- 3. FOCUS -->
  <figure>
    <div class="phone">
      <div class="status"><span>9:41</span><span class="island"></span><span>●●●</span></div>
      <div class="focus">
        <div class="top">
          <span class="chip"><span class="sq" style="background:var(--do)"></span>Do first · session 3 today</span>
          <button class="icon-btn" aria-label="Close"><svg class="ico"><use href="#x"/></svg></button>
        </div>
        <div class="mid">
          <span class="label">Focusing on</span>
          <p class="task-name">Fix broken survey export</p>
          <div class="timer">16<span class="s">:</span>28</div>
          <div class="bar"><i></i></div>
          <div class="ticks"><span>Started 10:14</span><span>Ends 10:39</span></div>
        </div>
        <div class="actions">
          <button class="btn primary"><svg class="ico fill" style="width:15px;height:15px"><use href="#pause"/></svg>Pause</button>
          <button class="btn secondary">Finish early</button>
          <button class="btn quiet">Abandon</button>
        </div>
      </div>
    </div>
    <figcaption>Focus: big timer, one clear action</figcaption>
  </figure>

</div>
<p class="note">On desktop it stays as you saw it: the 2×2 sheet with hover actions. The phone keeps the same type, colors and icons, but stacks the quadrants and moves actions to thumb reach (add + focus at the bottom).</p>
</body>
</html>
